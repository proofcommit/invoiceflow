name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode clean verify
      - run: docker build --build-arg SERVICE=invoiceflow-api --tag invoiceflow-api:ci .
      - run: docker build --build-arg SERVICE=invoiceflow-notifications --tag invoiceflow-notifications:ci .
