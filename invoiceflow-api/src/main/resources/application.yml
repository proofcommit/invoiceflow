server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: invoiceflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/invoiceflow}
    username: ${DATABASE_USERNAME:invoiceflow}
    password: ${DATABASE_PASSWORD:invoiceflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
  jackson:
    default-property-inclusion: non_null

invoiceflow:
  security:
    api-key: ${INVOICEFLOW_API_KEY:dev-invoiceflow-key}
  outbox:
    exchange: invoice.events
    relay-delay-ms: 1000
    confirm-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
